// TEST v2: Monthly report
// Compares the latest history row with the row nearest 30 days earlier.
// ------------------------------------------------------------

function parseCompetitionDate(value) {
  const text = String(value || "").trim();
  if (!text) return null;

  let match = text.match(/^(\d{1,2})[.\-/](\d{1,2})[.\-/](\d{4})$/);
  if (match) {
    const d = new Date(
      Number(match[3]),
      Number(match[2]) - 1,
      Number(match[1])
    );
    return Number.isNaN(d.getTime()) ? null : d;
  }

  match = text.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if (match) {
    const d = new Date(
      Number(match[1]),
      Number(match[2]) - 1,
      Number(match[3])
    );
    return Number.isNaN(d.getTime()) ? null : d;
  }

  const fallback = new Date(text);
  return Number.isNaN(fallback.getTime()) ? null : fallback;
}


function monthlyBaselineRow(historyRows) {
  if (!historyRows || historyRows.length < 2) {
    return null;
  }

  const latestRow = historyRows[historyRows.length - 1];
  const latestDate = parseCompetitionDate(latestRow["Dato"]);

  if (!latestDate) {
    return historyRows[Math.max(0, historyRows.length - 5)];
  }

  const target = new Date(latestDate);
  target.setDate(target.getDate() - 30);

  let bestRow = null;
  let bestDistance = Infinity;

  historyRows
    .slice(0, -1)
    .forEach(row => {
      const d = parseCompetitionDate(row["Dato"]);
      if (!d || d >= latestDate) return;

      const distance = Math.abs(d.getTime() - target.getTime());

      if (distance < bestDistance) {
        bestDistance = distance;
        bestRow = row;
      }
    });

  return bestRow || historyRows[Math.max(0, historyRows.length - 2)];
}


function signedPercentValue(value, decimals = 2) {
  const number = Number(value);
  if (!Number.isFinite(number)) return "–";

  const pct = number * 100;
  const sign = pct > 0 ? "+" : "";

  return sign +
    pct.toFixed(decimals).replace(".", ",") +
    "%";
}


function leaderboardPositionMap(leaderboard) {
  return Object.fromEntries(
    leaderboard.map((entry, index) => [
      entry.person,
      {
        rank: index + 1,
        score: entry.score
      }
    ])
  );
}


function monthlyThemeChanges(
  competitionRows,
  participants,
  startRow,
  baselineRow,
  latestRow
) {
  const before =
    calculateCompetition(
      competitionRows,
      participants,
      startRow,
      baselineRow
    );

  const after =
    calculateCompetition(
      competitionRows,
      participants,
      startRow,
      latestRow
    );

  const beforeThemes =
    Object.fromEntries(
      before.themeResults.map(item => [
        item.theme,
        item
      ])
    );

  return after.themeResults.map(item => {
    const previous = beforeThemes[item.theme];

    const delta =
      item.actualChange -
      previous.actualChange;

    const participantImpact =
      participants.map(person => {
        const beforeContribution =
          previous.personResults[person].weightedDistance;

        const afterContribution =
          item.personResults[person].weightedDistance;

        return {
          person,
          change:
            afterContribution -
            beforeContribution,
          improvement:
            beforeContribution -
            afterContribution
        };
      });

    const totalImpact =
      participantImpact.reduce(
        (sum, row) =>
          sum + Math.abs(row.change),
        0
      );

    const helped =
      participantImpact
        .slice()
        .sort(
          (a, b) =>
            b.improvement -
            a.improvement
        )[0];

    const hurt =
      participantImpact
        .slice()
        .sort(
          (a, b) =>
            b.change -
            a.change
        )[0];

    return {
      theme: item.theme,
      delta,
      absDelta: Math.abs(delta),
      totalImpact,
      helped,
      hurt
    };
  });
}



function leadOutlookAnalysis() {
  if (
    !currentOfficialResult ||
    !currentOfficialResult.leaderboard ||
    currentOfficialResult.leaderboard.length < 2
  ) {
    return null;
  }

  const leader =
    currentOfficialResult.leaderboard[0];

  const challenger =
    currentOfficialResult.leaderboard[1];

  const currentGap =
    challenger.score -
    leader.score;

  const results = [];

  currentOfficialResult.themeResults.forEach(themeResult => {
    const theme = themeResult.theme;
    const currentValue = themeResult.actualChange;

    // Probe size is deliberately modest and symmetric.
    // For percentage-return themes we test ±5 percentage points.
    // For policy-rate-like themes we test ±0.25 percentage points.
    const normalizedTheme =
      String(theme || "").trim().toLowerCase();

    const isRateTheme =
      normalizedTheme.includes("styringsrente") ||
      normalizedTheme.includes("rente");

    const probe =
      isRateTheme
        ? 0.0025
        : 0.05;

    [
      { direction: "up", delta: probe },
      { direction: "down", delta: -probe }
    ].forEach(test => {
      const simulatedLatest = {
        ...currentLatestRow,
        [theme]:
          rawValueFromChange(
            themeResult,
            currentValue + test.delta
          )
      };

      const simulated =
        calculateCompetition(
          currentCompetitionRows,
          currentParticipants,
          currentStartRow,
          simulatedLatest
        );

      const simMap =
        Object.fromEntries(
          simulated.leaderboard.map(row => [
            row.person,
            row
          ])
        );

      if (
        !simMap[leader.person] ||
        !simMap[challenger.person]
      ) {
        return;
      }

      const simulatedGap =
        simMap[challenger.person].score -
        simMap[leader.person].score;

      results.push({
        theme,
        direction: test.direction,
        improvement:
          currentGap -
          simulatedGap,
        simulatedGap
      });
    });
  });

  const favorable =
    results
      .filter(row => row.improvement > 0.000001)
      .sort(
        (a, b) =>
          b.improvement -
          a.improvement
      );

  return {
    leader: leader.person,
    challenger: challenger.person,
    currentGap,
    favorable
  };
}


function renderLeadOutlookText() {
  const analysis =
    leadOutlookAnalysis();

  if (!analysis) {
    return "Det er ikke nok data til å vurdere hvilke temaer som kan endre kampen om ledelsen.";
  }

  const top = [];
  const usedThemes = new Set();

  for (const item of analysis.favorable) {
    if (usedThemes.has(item.theme)) {
      continue;
    }

    usedThemes.add(item.theme);
    top.push(item);

    if (top.length >= 2) {
      break;
    }
  }

  if (!top.length) {
    return `${analysis.challenger} har akkurat nå ingen tydelig enkeltretning i ett tema som raskt reduserer gapet til ${analysis.leader}. Flere temaer må trolig bevege seg samtidig for å endre ledelsen.`;
  }

  const directionText = item => {
    const themeLower =
      String(item.theme || "").trim().toLowerCase();

    if (themeLower.includes("olje")) {
      return item.direction === "up"
        ? "oljeprisen stiger"
        : "oljeprisen faller";
    }

    if (
      themeLower.includes("styringsrente") ||
      themeLower.includes("rente")
    ) {
      return item.direction === "up"
        ? "styringsrenten stiger"
        : "styringsrenten faller";
    }

    return item.direction === "up"
      ? `${item.theme} stiger`
      : `${item.theme} faller`;
  };

  if (top.length === 1) {
    return `${analysis.challenger} har mest å hente på ${analysis.leader} dersom ${directionText(top[0])}. Det er dette temaet som akkurat nå gir størst mulighet til å redusere gapet mellom de to.`;
  }

  return `${analysis.challenger} har mest å hente på ${analysis.leader} dersom ${directionText(top[0])} og ${directionText(top[1])}. Det er disse temaene hvor videre utvikling i riktig retning sterkest reduserer gapet mellom #1 og #2.`;
}



function renderMonthlyReport() {
  const container =

  if (

    container.innerHTML = `

      <div class="month-report-panel">
        <p class="muted">
          Ikke nok historikk til å lage månedsrapport ennå.
        </p>
      </div>
    `;
    return;
  }

  const baselineRow =
    monthlyBaselineRow(
      currentHistoryRows
    );

  if (!baselineRow) return;

  const before =
    calculateCompetition(
      currentCompetitionRows,
      currentParticipants,
      currentStartRow,
      baselineRow
    );

  const after =
    currentOfficialResult;

  const beforeMap =
    leaderboardPositionMap(
      before.leaderboard
    );

  const afterMap =
    leaderboardPositionMap(
      after.leaderboard
    );

  const leader =
    after.leaderboard[0];

  const second =
    after.leaderboard[1];

  const currentMargin =
    leader && second
      ? second.score - leader.score
      : 0;

  const leaderBefore =
    beforeMap[leader.person];

  let leaderTrendText = "";

  if (leaderBefore) {
    if (leaderBefore.rank === 1) {
      const previousSecond =
        before.leaderboard[1];

      const previousMargin =
        previousSecond
          ? previousSecond.score -
            leaderBefore.score
          : 0;

      const marginChange =
        currentMargin -
        previousMargin;

      if (Math.abs(marginChange) < 0.00005) {
        leaderTrendText =
          `Ledelsen er omtrent uendret fra ${formatPercent(previousMargin)}.`;
      } else if (marginChange > 0) {
        leaderTrendText =
          `Ledelsen har økt fra ${formatPercent(previousMargin)} til ${formatPercent(currentMargin)}.`;
      } else {
        leaderTrendText =
          `Ledelsen har minket fra ${formatPercent(previousMargin)} til ${formatPercent(currentMargin)}.`;
      }
    } else {
      const oldLeader =
        before.leaderboard[0];

      const deficit =
        leaderBefore.score -
        oldLeader.score;

      leaderTrendText =
        `Ny leder – ${leader.person} var #${leaderBefore.rank} og ${formatPercent(deficit)} bak lederen ved periodestart.`;
    }
  }

  const developments =
    currentParticipants.map(person => {
      const oldRow = beforeMap[person];
      const newRow = afterMap[person];

      return {
        person,
        oldRank: oldRow.rank,
        newRank: newRow.rank,
        oldScore: oldRow.score,
        newScore: newRow.score,
        improvement:
          oldRow.score -
          newRow.score
      };
    });

  const bestDevelopment =
    developments
      .slice()
      .sort(
        (a, b) =>
          b.improvement -
          a.improvement
      )[0];

  const weakestDevelopment =
    developments
      .slice()
      .sort(
        (a, b) =>
          a.improvement -
          b.improvement
      )[0];

  const themeChanges =
    monthlyThemeChanges(
      currentCompetitionRows,
      currentParticipants,
      currentStartRow,
      baselineRow,
      currentLatestRow
    );

  const biggestMoves =
    themeChanges
      .slice()
      .sort(
        (a, b) =>
          b.absDelta -
          a.absDelta
      )
      .slice(0, 3);

  const biggestImpact =
    themeChanges
      .slice()
      .sort(
        (a, b) =>
          b.totalImpact -
          a.totalImpact
      )[0];

  const rankChangeText = item => {
    if (item.oldRank === item.newRank) {
      return `#${item.newRank} · uendret plassering`;
    }

    return `#${item.oldRank} → #${item.newRank}`;
  };

  const scoreDevelopmentText = item => {
    const delta =
      item.newScore -
      item.oldScore;

    return signedPercentValue(
      delta
    );
  };

  const impactText =
    biggestImpact
      ? (
          biggestImpact.helped &&

            biggestImpact.hurt.person

          : `${biggestImpact.theme} har gitt størst samlet utslag i deltakernes score i perioden.`
      : "–";

  const movementSentence =
    biggestMoves.length

            `${item.theme} (${signedPercentValue(item.delta)})`
        ).join(", ")}.`
      : "";

  const summaryText =
    `${bestDevelopment.person} har hatt best utvikling i perioden og gått ${rankChangeText(bestDevelopment)}. ` +
    `${weakestDevelopment.person} har hatt svakest utvikling (${rankChangeText(weakestDevelopment)}). ` +
    `${leader.person} leder nå med ${formatPercent(currentMargin)}. ` +
    movementSentence;

  container.innerHTML = `
    <h2>📅 Månedsrapport</h2>

    <div class="month-report-panel">

      <div class="month-report-period">
        <div class="month-period-main">
          ${baselineRow["Dato"]} → ${currentLatestRow["Dato"]}
        </div>
        <div class="month-period-note">
          Sammenligner siste status med historikkpunktet nærmest én måned tidligere.
        </div>
      </div>

      <div class="month-report-top">

        <div class="month-card month-card-leader">
          <div class="month-card-label">🏆 Leder nå</div>

          <div class="month-person">
            <img
              src="${participantImagePath(leader.person)}"
              alt="${leader.person}"
              onerror="this.style.display='none';">

            <div>
              <div class="month-person-name">${leader.person}</div>
              <div class="month-subline">
                Score ${formatPercent(leader.score)}
              </div>
            </div>
          </div>

          <div class="month-main-value">
            ${formatPercent(currentMargin)} foran #2
          </div>

          <div class="month-subline">
            ${leaderTrendText}
          </div>
        </div>


        <div class="month-card">
          <div class="month-card-label">🚀 Best utvikling</div>

          <div class="month-person">
            <img
              src="${participantImagePath(bestDevelopment.person)}"

              onerror="this.style.display='none';">

            <div>
              <div class="month-person-name">${bestDevelopment.person}</div>
              <div class="month-subline">
                ${rankChangeText(bestDevelopment)}
              </div>
            </div>
          </div>

          <div class="month-main-value movement-up">
            ${scoreDevelopmentText(bestDevelopment)}
          </div>

          <div class="month-subline">

            Score ${formatPercent(weakestDevelopment.oldScore)}
            → ${formatPercent(weakestDevelopment.newScore)}

        </div>

      <div class="month-report-lower">

        <div class="month-card">

          <div class="month-moves">

// TEST v3: Investor
// 100 000 kr equally distributed across all themes except Styringsrente.
// Positive prediction = LONG, negative prediction = SHORT, 0 = flat.
// No FF weighting, leverage, costs, dividends or market frictions.
// ------------------------------------------------------------

let activeInvestorPeriod = "year";
let selectedInvestorParticipant = null;

function investorThemeIncluded(themeName) {
  const t = String(themeName || "").trim().toLowerCase();
  return !t.includes("styringsrente");
}

function investorDirection(prediction) {
  const n = Number(prediction);
  if (!Number.isFinite(n) || Math.abs(n) < 1e-12) return 0;
  return n > 0 ? 1 : -1;
}

function investorCurrency(value) {
  return new Intl.NumberFormat("nb-NO", {
    style: "currency",
    currency: "NOK",
    maximumFractionDigits: 0
  }).format(value);
}

function investorPercent(value, decimals = 2) {
  const n = Number(value);
  if (!Number.isFinite(n)) return "–";
  const pct = n * 100;
  const sign = pct > 0 ? "+" : "";
  return sign + pct.toFixed(decimals).replace(".", ",") + "%";
}

function investorPositionHtml(direction) {
  if (direction > 0) return '<span class="investor-long">🟢 LONG</span>';
  if (direction < 0) return '<span class="investor-short">🔴 SHORT</span>';
  return '<span class="investor-flat">⚪ FLAT</span>';
}

function investorPeriodSetup(period) {
  if (period === "month") {
    const baseline = monthlyBaselineRow(currentHistoryRows);
    return baseline
      ? { startRow: baseline, endRow: currentLatestRow, label: "1 mnd" }
      : null;
  }

  return {
    startRow: currentStartRow,
    endRow: currentLatestRow,
    label: `FF${activeSeasonYear}`
  };
}

function investorSingleSeasonResult(season, person, startingCapital = 100000) {
  if (!season || !season.result || !season.result.themeResults) return null;

  const themes = season.result.themeResults.filter(
    row => investorThemeIncluded(row.theme)
  );

  if (!themes.length || !season.participants.includes(person)) return null;

  const allocation = startingCapital / themes.length;

  const details = themes.map(theme => {
    const prediction =
      theme.personResults[person]
        ? theme.personResults[person].prediction
        : 0;

    const direction = investorDirection(prediction);
    const actualReturn = Number(theme.actualChange) || 0;
    const positionReturn = direction * actualReturn;
    const contribution = allocation * positionReturn;
    const endValue = allocation + contribution;

    return {
      year: season.year,
      theme: theme.theme,
      prediction,
      direction,
      actualReturn,
      positionReturn,
      contribution,
      endValue
    };
  });

  const endValue = details.reduce((sum, item) => sum + item.endValue, 0);

  return {
    startValue: startingCapital,
    endValue,
    totalReturn: startingCapital ? endValue / startingCapital - 1 : 0,
    details
  };
}

function investorAllTimeResults() {
  const years = Object.keys(allSeasonData)
    .map(Number)
    .filter(year => year <= activeSeasonYear)
    .sort((a, b) => a - b);

  if (!years.length) return null;

  const rows = currentParticipants.map(person => {
    let capital = 100000;
    const yearly = [];
    const details = [];

    years.forEach(year => {
      const season = allSeasonData[year];
      const result = investorSingleSeasonResult(season, person, capital);
      if (!result) return;

      yearly.push({
        year,
        startValue: capital,
        annualReturn: result.totalReturn,
        endValue: result.endValue
      });

      details.push(...result.details);
      capital = result.endValue;
    });

    return {
      person,
      endValue: capital,
      totalReturn: capital / 100000 - 1,
      details,
      yearly
    };
  }).sort((a, b) => b.endValue - a.endValue);

  return {
    label: `All-time · FF${years[0]}–FF${years[years.length - 1]}`,
    rows,
    years,
    allTime: true
  };
}

function investorResults(period) {
  if (period === "all") {
    return investorAllTimeResults();
  }

  const setup = investorPeriodSetup(period);
  if (!setup || !currentCompetitionRows || !currentParticipants) return null;

  const periodResult = calculateCompetition(
    currentCompetitionRows,
    currentParticipants,
    setup.startRow,
    setup.endRow
  );

  const themes = periodResult.themeResults.filter(
    row => investorThemeIncluded(row.theme)
  );

  if (!themes.length) return null;

  const allocation = 100000 / themes.length;

  const rows = currentParticipants.map(person => {
    const details = themes.map(theme => {
      const prediction =
        theme.personResults[person]
          ? theme.personResults[person].prediction
          : 0;

      const direction = investorDirection(prediction);
      const actualReturn = Number(theme.actualChange) || 0;
      const positionReturn = direction * actualReturn;
      const contribution = allocation * positionReturn;
      const endValue = allocation + contribution;

      return {
        theme: theme.theme,
        prediction,
        direction,
        actualReturn,
        positionReturn,
        contribution,
        endValue
      };
    });

    const endValue = details.reduce((sum, item) => sum + item.endValue, 0);

    return {
      person,
      endValue,
      totalReturn: endValue / 100000 - 1,
      details,
      yearly: []
    };
  }).sort((a, b) => b.endValue - a.endValue);

  return {
    label: setup.label,
    allocation,
    themes,
    rows,
    allTime: false
  };
}

let selectedDuelA = null;
let selectedDuelB = null;


function duelParticipantScore(person) {

  if (
    !currentOfficialResult ||
    !currentOfficialResult.leaderboard
  ) {
    return null;
  }

  const row =
    currentOfficialResult.leaderboard.find(
      item =>
        item.person === person
    );

  return row
    ? Number(row.score)
    : null;
}


function duelThemeRows(personA, personB) {

  const EPS =
    0.0000001;

  return currentThemeResults.map(
    theme => {

      const a =
        theme.personResults[
          personA
        ];

      const b =
        theme.personResults[
          personB
        ];

      const aPrediction =
        a
          ? Number(
              a.prediction
            )
          : 0;

      const bPrediction =
        b
          ? Number(
              b.prediction
            )
          : 0;

      const actual =
        Number(
          theme.actualChange
        );

      const weight =
        Number(
          theme.weight
        ) || 0;

      const aScore =
        a
          ? Number(
              a.weightedDistance
            )
          : 0;

      const bScore =
        b
          ? Number(
              b.weightedDistance
            )
          : 0;

      const advantage =
        bScore - aScore;

      const lowerPrediction =
        Math.min(
          aPrediction,
          bPrediction
        );

      const higherPrediction =
        Math.max(
          aPrediction,
          bPrediction
        );

      const lowerPerson =
        aPrediction <= bPrediction
          ? personA
          : personB;

      const higherPerson =
        aPrediction <= bPrediction
          ? personB
          : personA;

      const predictionGap =
        Math.abs(
          aPrediction -
          bPrediction
        );

      const samePrediction =
        predictionGap <= EPS;

      const inside =
        !samePrediction &&
        actual >
          lowerPrediction + EPS &&
        actual <
          higherPrediction - EPS;

      const onLower =
        !samePrediction &&
        Math.abs(
          actual -
          lowerPrediction
        ) <= EPS;

      const onHigher =
        !samePrediction &&
        Math.abs(
          actual -
          higherPrediction
        ) <= EPS;

      let pivotType =
        "none";

      let pivotDistance =
        Infinity;

      let pivotDirection =
        null;

      let afterPivotFavours =
        null;

      if (samePrediction) {

        pivotType =
          "same";

      } else if (
        inside ||
        onLower ||
        onHigher
      ) {

        pivotType =
          "direct";

        pivotDistance =
          0;

      } else if (
        actual <
        lowerPrediction
      ) {

        pivotType =
          "latent";

        pivotDistance =
          lowerPrediction -
          actual;

        pivotDirection =
          "opp";

        // Below both estimates, movement up affects both equally
        // until the lower estimate is crossed. Beyond it,
        // further upside favours the participant with the higher estimate.
        afterPivotFavours =
          higherPerson;

      } else if (
        actual >
        higherPrediction
      ) {

        pivotType =
          "latent";

        pivotDistance =
          actual -
          higherPrediction;

        pivotDirection =
          "ned";

        // Above both estimates, movement down affects both equally
        // until the higher estimate is crossed. Beyond it,
        // further downside favours the participant with the lower estimate.
        afterPivotFavours =
          lowerPerson;
      }

      const directImpactPotential =
        predictionGap *
        weight;

      return {
        theme:
          theme.theme,
        actual,
        weight,
        aPrediction,
        bPrediction,
        aScore,
        bScore,
        advantage,
        lowerPrediction,
        higherPrediction,
        lowerPerson,
        higherPerson,
        predictionGap,
        pivotType,
        pivotDistance,
        pivotDirection,
        afterPivotFavours,
        directImpactPotential,
        winner:
          Math.abs(
            advantage
          ) < EPS
            ? "Lik"
            : advantage > 0
              ? personA
              : personB
      };
    }
  );
}


function duelPercent(value) {
  const n = Number(value);

  if (!Number.isFinite(n)) {
    return "–";
  }

  return (
    (n * 100)
      .toFixed(1)
      .replace(".", ",") +
    "%"
  );
}

function renderHeadToHead() {

  const container =
    document.getElementById(
      "headToHeadSection"
    );

  if (
    !container ||
    !currentParticipants ||
    currentParticipants.length < 2
  ) {
    return;
  }

  if (
    !selectedDuelA ||
    !currentParticipants.includes(
      selectedDuelA
    )
  ) {
    selectedDuelA =
      currentOfficialResult.leaderboard[0]
        ? currentOfficialResult.leaderboard[0].person
        : currentParticipants[0];
  }

  if (
    !selectedDuelB ||
    selectedDuelB === selectedDuelA ||
    !currentParticipants.includes(
      selectedDuelB
    )
  ) {
    selectedDuelB =
      currentOfficialResult.leaderboard.find(
        row =>
          row.person !==
          selectedDuelA
      )?.person ||
      currentParticipants.find(
        person =>
          person !==
          selectedDuelA
      );
  }


  const scoreA =
    duelParticipantScore(
      selectedDuelA
    );

  const scoreB =
    duelParticipantScore(
      selectedDuelB
    );

  const rows =
    duelThemeRows(
      selectedDuelA,
      selectedDuelB
    );

  const leader =
    scoreA <= scoreB
      ? selectedDuelA
      : selectedDuelB;

  const trailer =
    leader === selectedDuelA
      ? selectedDuelB
      : selectedDuelA;

  const gap =
    Math.abs(
      scoreA - scoreB
    );

  const decisive =
    [...rows]
      .sort(
        (a, b) =>
          Math.abs(
            b.advantage
          ) -
          Math.abs(
            a.advantage
          )
      );

  const directPivots =
    rows
      .filter(
        row =>
          row.pivotType ===
          "direct"
      )
      .sort(
        (a, b) =>
          b.directImpactPotential -
          a.directImpactPotential
      );

  const latentPivots =
    rows
      .filter(
        row =>
          row.pivotType ===
          "latent"

      .sort(
        (a, b) =>

      `Videre ${movementWord.toLowerCase()} favoriserer ${row.afterPivotFavours}.`

  }


  let summary =

          </div>

  });
}


async function loadAllSeasonData() {

  const entries =
    Object.entries(
      seasonConfig
    );

  const results =
    await Promise.allSettled(
      entries.map(
        async ([year, config]) => {
          const [historyRaw, dashboardRaw] =
            await Promise.all([
              loadCsv(config.historyUrl),
              loadCsv(config.dashboardDataUrl)
            ]);

          return buildSeasonData(
            Number(year),
            historyRaw,
            dashboardRaw
          );
        }
      )
    );

  const errors = [];

  results.forEach(
    (result, index) => {
      const year =
        Number(entries[index][0]);

      if (result.status === "fulfilled") {
        allSeasonData[year] =
          result.value;
      } else {
        errors.push(
          `FF${year}: ${result.reason.message}`
        );
        console.error(
          `Kunne ikke laste FF${year}`,
          result.reason
        );
      }
    }
  );

  if (
    !allSeasonData[2026]
  ) {
    throw new Error(
      "FF2026 kunne ikke lastes. " +
      errors.join(" · ")
    );
  }

  if (typeof window.configureFFAccess === "function") {
    window.configureFFAccess(
      allSeasonData[2026].accessCode
    );
  }

  renderSeasonSelector();
  activateSeason(2026);

  if (errors.length) {
    console.warn(
      "Noen historiske sesonger kunne ikke lastes:",
      errors
    );
  }
}

      row.appendChild(heading);
    }else{
      row.classList.add("ff-section-heading-row");
    }
    const b=document.createElement("button");
    b.type="button";
    b.className="ff-section-top-btn";
    b.textContent="↑ Topp";
    b.setAttribute("aria-label","Til toppen");
    b.addEventListener("click",goTop);
    row.appendChild(b);
  }

  function enhance(){ids.forEach(id=>add(document.getElementById(id)));}
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",enhance,{once:true});
  else enhance();
  new MutationObserver(enhance).observe(document.documentElement,{childList:true,subtree:true});
})();

// ------------------------------------------------------------
// v7.8: robust one.com / iframe navigation bridge
//
// Key change:
// - The dashboard proactively sends a complete map of section positions
//   to the parent page after load and whenever layout changes.
// - The parent no longer needs a request/response round-trip for every click.
// - The old request-based method is still supported as a fallback.
// - "↑ Topp" sends an explicit scroll-to-dashboard-top command.
// ------------------------------------------------------------
(function setupRobustParentNavigationBridge() {
  const navTargets = {
    leaderboardSection: "Live",
    monthSection: "Måned",
    chartSection: "Analyse",
    themeSection: "Tema",
    historySection: "Race",
    simulatorSection: "Hva hvis?",
    participantSection: "Deltaker",
    estimatesSection: "Estimat",
    investorSection: "Investor",
    headToHeadSection: "Duell"
  };

  let externalNavigationEnabled = false;
  let lastMapJson = "";
  let mapRaf = null;

  function getTargetTop(id) {
    const el = document.getElementById(id);
    if (!el) return null;

    return Math.max(
      0,
      Math.round(el.getBoundingClientRect().top + window.scrollY)
    );
  }

  function buildNavigationMap() {
    const targets = {};

    Object.keys(navTargets).forEach((id) => {
      const top = getTargetTop(id);
      if (Number.isFinite(top)) {
        targets[id] = top;
      }
    });

    return targets;
  }

  function sendNavigationMap(force = false) {
    if (!window.parent || window.parent === window) return;

    if (mapRaf) cancelAnimationFrame(mapRaf);

    mapRaf = requestAnimationFrame(() => {
      mapRaf = null;

      const targets = buildNavigationMap();
      const json = JSON.stringify(targets);

      if (!force && json === lastMapJson) return;
      lastMapJson = json;

      window.parent.postMessage(
        {
          type: "fiascofinance-navigation-map",
          targets: targets
        },
        "*"
      );
    });
  }

  function enableExternalNavigation() {
    externalNavigationEnabled = true;
    document.body.classList.add("ff-external-nav");

    // Layout can change when the internal quick-nav is hidden.
    setTimeout(() => sendNavigationMap(true), 0);
    setTimeout(() => sendNavigationMap(true), 100);
    setTimeout(() => sendNavigationMap(true), 350);
    window.dispatchEvent(new Event("resize"));

    window.parent.postMessage(
      {
        type: "fiascofinance-parent-ack",
        externalNavigation: true
      },
      "*"
    );
  }

  function sendOneTarget(target) {
    if (!Object.prototype.hasOwnProperty.call(navTargets, target)) return;

    const top = getTargetTop(target);
    if (!Number.isFinite(top)) return;

    window.parent.postMessage(
      {
        type: "fiascofinance-nav-target",
        target: target,
        top: top
      },
      "*"
    );
  }

  window.addEventListener("message", function(event) {
    if (!window.parent || event.source !== window.parent) return;
    if (!event.data || typeof event.data !== "object") return;

    if (event.data.type === "fiascofinance-parent-ready") {
      enableExternalNavigation();
      return;
    }

    // Backward-compatible fallback for the earlier one.com embed code.
    if (event.data.type === "fiascofinance-get-nav-target") {
      sendOneTarget(String(event.data.target || ""));
      return;
    }

    if (event.data.type === "fiascofinance-request-navigation-map") {
      sendNavigationMap(true);
    }
  });

  // Publish the map proactively as soon as the dashboard is usable.
  function initialPublish() {
    sendNavigationMap(true);
    setTimeout(() => sendNavigationMap(true), 150);
    setTimeout(() => sendNavigationMap(true), 600);
    setTimeout(() => sendNavigationMap(true), 1500);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initialPublish, { once: true });
  } else {
    initialPublish();
  }

  window.addEventListener("load", initialPublish);
  window.addEventListener("resize", () => sendNavigationMap(true));

  // Season switches, charts, participant cards etc. can move section positions.
  if ("ResizeObserver" in window) {
    const ro = new ResizeObserver(() => sendNavigationMap());
    ro.observe(document.documentElement);
    if (document.body) ro.observe(document.body);
  }

  if ("MutationObserver" in window) {
    const mo = new MutationObserver(() => sendNavigationMap());
    mo.observe(document.documentElement, {
      childList: true,
      subtree: true,
      attributes: true,
      characterData: true
    });
  }

  // Small public helper used by the v7.7 "↑ Topp" buttons.
  window.ffScrollDashboardTop = function() {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage(
        { type: "fiascofinance-scroll-top" },
        "*"
      );
    } else {
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
  };
})();

// ------------------------------------------------------------
// one.com / iframe auto-height support
// Sends the dashboard's current document height to the parent page.
// The parent can then resize the iframe so the visitor gets one
// continuous scrollbar instead of scrolling inside the dashboard.
// ------------------------------------------------------------
(function setupParentAutoHeight() {
  let lastHeight = 0;
  let rafId = null;

  function getDocumentHeight() {
    const body = document.body;
    const root = document.documentElement;

    return Math.ceil(Math.max(
      body ? body.scrollHeight : 0,
      body ? body.offsetHeight : 0,
      root ? root.scrollHeight : 0,
      root ? root.offsetHeight : 0,
      root ? root.clientHeight : 0
    ));
  }

  function sendHeight(force = false) {
    if (rafId) {
      cancelAnimationFrame(rafId);
    }

    rafId = requestAnimationFrame(() => {
      rafId = null;
      const height = getDocumentHeight();

      if (!force && Math.abs(height - lastHeight) < 2) {
        return;
      }

      lastHeight = height;

      if (window.parent && window.parent !== window) {
        window.parent.postMessage(
          {
            type: "fiascofinance-dashboard-height",
            height: height
          },
          "*"
        );
      }
    });
  }

  // Initial measurements: once immediately and again after fonts/images/layout settle.
  sendHeight(true);
  window.addEventListener("load", () => {
    sendHeight(true);
    setTimeout(() => sendHeight(true), 250);
    setTimeout(() => sendHeight(true), 1000);
  });

  // Browser/device width changes can alter wrapping and therefore total height.
  window.addEventListener("resize", () => sendHeight(true));

  // Watch the complete document for real layout-size changes.
  if ("ResizeObserver" in window) {
    const resizeObserver = new ResizeObserver(() => sendHeight());
    resizeObserver.observe(document.documentElement);
    if (document.body) resizeObserver.observe(document.body);
  }

  // Dynamic dashboard rendering, season switches, charts and profile changes
  // can change height without a window resize.
  if ("MutationObserver" in window) {
    const mutationObserver = new MutationObserver(() => sendHeight());
    mutationObserver.observe(document.documentElement, {
      childList: true,
      subtree: true,
      attributes: true,
      characterData: true
    });
  }

  // Safety net for delayed chart/image rendering.
  let checks = 0;
  const timer = setInterval(() => {
    sendHeight();
    checks += 1;
    if (checks >= 20) clearInterval(timer);
  }, 500);
})();

initializeTheme();
loadData();

</script>
